name: Sync vocab cache

on:
  schedule:
    # 21:00 UTC = 05:00 HKT — 1h before the article sync (22:00 UTC), so
    # the two workflows' commit-and-push steps never race each other.
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull generated vocab from production
        run: python3 sync_vocab.py

      - name: Commit and push if articles.db changed
        run: |
          if git diff --quiet -- articles.db; then
            echo "No new vocab to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.db
          git commit -m "chore: sync vocab cache $(date -u +%Y-%m-%d)"
          git push
