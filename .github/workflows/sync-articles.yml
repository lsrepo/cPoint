name: Sync articles

on:
  schedule:
    # 22:00 UTC = 06:00 HKT (UTC+8, no DST)
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run incremental sync
        run: python3 sync_articles.py

      - name: Commit and push if articles.db changed
        run: |
          if git diff --quiet -- articles.db; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.db
          git commit -m "chore: sync articles $(date -u +%Y-%m-%d)"
          git push
