name: Sync articles

on:
  # 06:00 HKT is fired by the cpoint-sync-tick Worker (22:00 UTC),
  # which dispatches this workflow. GitHub's own schedule starts late.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run incremental sync
        run: python3 sync_articles.py

      - name: Publish new Cantonese podcast episodes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PODCAST_MEDIA_BASE_URL: ${{ secrets.PODCAST_MEDIA_BASE_URL }}
          PODCAST_START_DATE: "2026-11-09"
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "Skipping podcast sync: R2 credentials not set"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          python3 sync_podcast.py

      - name: Commit and push if articles.db changed
        run: |
          if git diff --quiet -- articles.db; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.db
          git commit -m "chore: sync articles $(date -u +%Y-%m-%d)"
          git push
